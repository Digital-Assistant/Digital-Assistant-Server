version: '3.8'

services:
  uda-backend-test:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: udan-backend:latest
    container_name: uda-backend-test
    restart: unless-stopped
    ports:
      - "11082:11081"
    volumes:
      - ./src/main/resources/test.properties:/deployments/config/additional.properties:ro
    networks:
      - uda-network

networks:
  uda-network:
    external: true
