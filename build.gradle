plugins {
    id 'java'
    id 'io.quarkus' version '3.2.10.Final'
    id "org.owasp.dependencycheck" version "9.0.9"
    id 'pmd'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.4'
}

repositories {
    mavenCentral()
}

// Same JDK as CI (Temurin 21) and src/main/docker/Dockerfile.jvm; the build no longer depends on JAVA_HOME.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Flyway 9.17.0 (Quarkus BOM default) does not support MariaDB 10.11+
// Override with 9.22.3 which is the latest 9.x community release with full MariaDB 10.11 support
configurations.all {
    resolutionStrategy {
        force 'org.flywaydb:flyway-core:9.22.3'
        force 'org.flywaydb:flyway-mysql:9.22.3'
    }
}

// Dependency versions are locked in gradle.lockfile (all configurations). After changing a dependency or
// plugin, regenerate it with: ./gradlew dependencies --write-locks
dependencyLocking {
    lockAllConfigurations()
}

// Formatter: Eclipse JDT profile that encodes CONVENTIONS.md (tabs, LF, 120 columns). Ratchet: only files changed
// since origin/dev are checked or rewritten, the rest of the tree is never reformatted. Full-tree report (does not
// fail on existing debt only if you ignore the exit code): ./gradlew spotlessCheck -PspotlessFull
spotless {
    if (!project.hasProperty('spotlessFull')) {
        ratchetFrom 'origin/dev'
    }
    java {
        target 'src/**/*.java'
        eclipse().configFile('config/spotless/eclipse-formatter.xml')
        lineEndings = com.diffplug.spotless.LineEnding.UNIX
        endWithNewline()
    }
}

// Linter: bug-oriented PMD ruleset. PMD has no baseline file, so files that violate it today are listed in the
// ruleset's exclude patterns (config/pmd/ruleset.xml); that list only shrinks. New files are checked in full.
pmd {
    toolVersion = '7.29.0'
    ruleSetFiles = files('config/pmd/ruleset.xml')
    ruleSets = []
    consoleOutput = true
}

// Command surface (see CONTRIBUTING.md). Gradle task names cannot contain ':', so the format:check verb is formatCheck.
// format rewrites files; every other verb is read-only. `security` runs the lockfile scanner (scripts/ci/scan.sh).
tasks.register('format') {
    group = 'verification'
    description = 'Format changed Java files in place (ratchet against origin/dev).'
    dependsOn 'spotlessApply'
}
tasks.register('baselineCheck', Exec) {
    group = 'verification'
    description = 'Fail if a violation count went up or the coverage floor went down (docs/agentic-readiness/digital-assistant-server-quality-baseline.json).'
    commandLine 'scripts/ci/check-baseline.sh'
}
tasks.register('formatCheck') {
    group = 'verification'
    description = 'Fail if changed Java files are not formatted or a baseline count went up (read-only).'
    dependsOn 'spotlessCheck', 'baselineCheck'
}
tasks.register('lint') {
    group = 'verification'
    description = 'Run the PMD bug-oriented ruleset on main and test code (read-only).'
    dependsOn 'pmdMain', 'pmdTest'
}
tasks.register('typecheck') {
    group = 'verification'
    description = 'Compile main and test Java without running anything.'
    dependsOn 'compileJava', 'compileTestJava'
}

// check = formatCheck, then typecheck, then test (PMD joins check through its plugin and is green under the baseline).
tasks.register('security', Exec) {
    group = 'verification'
    description = 'Scan gradle.lockfile for known vulnerable dependencies (OSV-Scanner, report-only by default; needs network).'
    commandLine 'scripts/ci/scan.sh'
}

// Coverage (line, JaCoCo). @QuarkusTest classes run inside Quarkus's own class loader, so the core JaCoCo agent skips
// that loader and io.quarkus:quarkus-jacoco writes the data file instead (Quarkus test-coverage guide); both land in
// build/jacoco-quarkus.exec. A plain core-JaCoCo run reports @QuarkusTest classes far too low, so never measure without it.
// The floor below is today's measured line coverage rounded down. A floor only goes up: raising it is a deliberate commit,
// lowering it needs the owner (AGENTS.md, "Baselines and floors"). The tests need the local stack, so the floor is
// enforced by a CI step (scripts/ci/coverage.sh), not by `check`.
jacoco {
    toolVersion = '0.8.12'
}
tasks.named('test') {
    jacoco {
        excludeClassLoaders = ['*QuarkusClassLoader']
        destinationFile = layout.buildDirectory.file('jacoco-quarkus.exec').get().asFile
    }
}
tasks.named('jacocoTestReport') {
    description = 'Write the line-coverage report from the last test run (build/reports/jacoco/test).'
    reports {
        xml.required = true
        html.required = true
    }
}
tasks.named('jacocoTestCoverageVerification') {
    description = 'Fail if line coverage from the last test run is below the floor.'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70 // measured 70.6 percent (951 of 1347 lines) on 2026-11-06, rounded down
            }
        }
    }
}
tasks.register('coverage') {
    group = 'verification'
    description = 'Run the tests with the local stack up, write the coverage report and enforce the floor.'
    dependsOn 'test', 'jacocoTestReport', 'jacocoTestCoverageVerification'
}
tasks.named('jacocoTestReport') { mustRunAfter 'test' }
tasks.named('jacocoTestCoverageVerification') { mustRunAfter 'jacocoTestReport' }

check.dependsOn 'formatCheck', 'typecheck'
tasks.named('typecheck') { mustRunAfter 'formatCheck' }
tasks.named('test') { mustRunAfter 'typecheck' }

group "com.nistapp.voice"
version "0.0.1" // x-release-please-version
dependencies {
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation enforcedPlatform("io.quarkus:quarkus-bom:${quarkusVersion}")
    implementation 'io.quarkus:quarkus-resteasy'
    implementation 'io.quarkus:quarkus-resteasy-jackson'
    implementation 'io.quarkus:quarkus-resteasy-jsonb'
    implementation 'io.quarkus:quarkus-jdbc-mariadb'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-hibernate-search-orm-elasticsearch'
    implementation 'io.quarkus:quarkus-flyway'
    implementation 'org.flywaydb:flyway-mysql:9.22.3'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-oidc'
    implementation 'io.quarkus:quarkus-smallrye-health' // /q/health, used by CI and the Docker HEALTHCHECK
//    implementation 'io.quarkus:quarkus-keycloak-authorization'

    implementation 'com.vladmihalcea:hibernate-types-60:2.21.1'
    // Linear-time regex engine for InputSanitizer, which runs on request bodies (no ReDoS)
    implementation 'com.google.re2j:re2j:1.8'

    //implementation 'io.quarkus:quarkus-hibernate-orm'
    //implementation 'org.jboss.jandex:jandex-maven-plugin'

    // For Logging
    implementation 'io.quarkus:quarkus-logging-json' // For JSON formatted logs
    implementation 'io.quarkus:quarkus-logging-gelf' // For GELF logging (optional)

    // Testing
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.quarkus:quarkus-test-security'
    testImplementation 'io.quarkus:quarkus-test-security-oidc' // @OidcSecurity: token claims (azp, sub) in tests
    testImplementation 'io.quarkus:quarkus-jacoco' // line coverage for @QuarkusTest classes (version from the Quarkus BOM)
}

