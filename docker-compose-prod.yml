version: '3.8'

services:
  uda-backend-prod:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    image: udan-backend:latest
    container_name: uda-backend-prod
    restart: unless-stopped
    ports:
      - "${QUARKUS_HTTP_PORT:-11081}:11081"
    volumes:
      - ./src/main/resources/prod.properties:/deployments/config/additional.properties:ro
    networks:
      - uda-network

networks:
  uda-network:
    external: true
