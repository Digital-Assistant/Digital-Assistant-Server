name: Image

# Builds the Server image, scans it, and (on dev and release tags) pushes it to GHCR.
# Only GitHub-owned actions are used (repo allow-list); Docker and Trivy are called from
# scripts/ci/image*.sh. Nothing is deployed. No layer cache is restored: this workflow
# publishes images, and a restored cache could carry poisoned layers into them.

on:
  push:
    branches: ['dev']
    tags: ['v*']
  pull_request:
    branches: ['dev']
    paths:
      - 'src/main/docker/**'
      - '.dockerignore'
      - 'build.gradle'
      - 'gradle.properties'
      - 'scripts/ci/image*.sh'
      - '.github/workflows/image.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPO: ghcr.io/digital-assistant/udan-server

jobs:
  build-scan:
    name: Build and Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Build image
        env:
          IMAGE_NAME: ${{ env.IMAGE_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_TAR: ${{ runner.temp }}/image.tar
        run: scripts/ci/image.sh

      # TODO: make blocking once the Quarkus 3.2.10 dependency findings are fixed or accepted
      # (38 fixable HIGH/CRITICAL on 2026-10-22, see artefacts/cicd/P12-image-builds-output.md).
      # Until then a finding does not stop the image from being pushed.
      - name: Scan image and write SBOM
        continue-on-error: true
        env:
          IMAGE_TAR: ${{ runner.temp }}/image.tar
          SBOM_PATH: ${{ runner.temp }}/sbom.cdx.json
        run: scripts/ci/image-scan.sh "$IMAGE_TAR" "$SBOM_PATH"

      - name: Upload SBOM
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload image
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  push:
    name: Push to GHCR
    needs: build-scan
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pushed image digest (sha256:...), for a later deploy job (needs: push).
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - name: Log in to GHCR
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR_NAME" --password-stdin

      # Tags: always sha-<commit>; on a release tag vX.Y.Z also X.Y.Z. Never latest.
      - name: Push image
        id: push
        env:
          IMAGE_TAR: ${{ runner.temp }}/image.tar
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags=("sha-${COMMIT_SHA}")
          if [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $REF_NAME is not vX.Y.Z"; exit 1; }
            tags+=("${REF_NAME#v}")
          fi
          scripts/ci/image-push.sh "$IMAGE_TAR" "$IMAGE_REPO" "${tags[@]}" | tee push.log
          echo "digest=$(sed -n 's/^digest=//p' push.log | tail -n1)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
