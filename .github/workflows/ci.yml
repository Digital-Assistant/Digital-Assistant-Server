name: CI

on:
  push:
    branches: ['dev']
  pull_request:
    branches: ['dev']
  # The merge queue verifies PRs on a temporary merge-group ref: without this trigger the
  # required `CI Gate` check never reports there and every queued merge times out.
  merge_group:

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to dev always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Throwaway services for the tests. The password exists only inside this job.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: udan
          MARIADB_USER: udan
          MARIADB_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.16
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Spotless's ratchetFrom 'origin/dev' needs the integration branch, not a shallow clone.
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: scripts/ci/build.sh

      - name: Test
        env:
          # The packaged URL asks for SSL; the CI MariaDB has none.
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:mariadb://127.0.0.1:3306/udan
          QUARKUS_DATASOURCE_USERNAME: udan
          QUARKUS_DATASOURCE_PASSWORD: ci-test-only
        run: scripts/ci/test.sh

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Report-only: OSV-Scanner over gradle.lockfile (`./gradlew security`). The existing findings are recorded debt,
  # so the job is outside `gate.needs` and never blocks a merge; it still fails on a scanner error. The count is
  # written to the job summary. Switch to blocking with SCAN_MODE=block once the count is zero or an ignore list
  # with a reason and expiry per entry exists, and then add the job to `gate.needs`.
  scan:
    name: Dependency Scan (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan lockfile (report-only)
        run: scripts/ci/scan.sh

  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan new commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            scripts/ci/secrets.sh "$PR_BASE" "$PR_HEAD"
          elif [[ "$EVENT" == "merge_group" ]]; then
            scripts/ci/secrets.sh "$MG_BASE" "$MG_HEAD"
          elif [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            scripts/ci/secrets.sh "$PUSH_BEFORE" "$PUSH_AFTER"
          else
            echo "New branch: nothing to compare against, skipping."
          fi

  codeql:
    name: CodeQL (Java)
    # Fork PRs get a read-only token and cannot upload results, so they skip this job.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/ci/build.sh runs check, whose Spotless ratchet needs origin/dev (no shallow clone).
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build
        run: scripts/ci/build.sh

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:java-kotlin

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows
        run: scripts/ci/lint-workflows.sh

  docs-lint:
    name: Docs Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Advisory: not part of `gate` yet (owner decision). Runs only when Markdown or its lint wiring changes.
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect docs changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE" "$HEAD"
            if git diff --name-only "$BASE" "$HEAD" | grep -E '\.md$|^\.markdownlint-cli2\.yaml$|^scripts/ci/docs-lint' ; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 22
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The cache key follows the pinned tool versions in the script.
      - name: Cache npm and Puppeteer downloads
        if: ${{ steps.changes.outputs.run == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: docs-lint-${{ runner.os }}-${{ hashFiles('scripts/ci/docs-lint.sh') }}

      - name: Lint docs
        if: ${{ steps.changes.outputs.run == 'true' }}
        run: scripts/ci/docs-lint.sh

  # Single required status check for branch protection. Skipped jobs count as success;
  # failed or cancelled jobs fail the gate.
  gate:
    name: CI Gate
    needs: [build-test, secrets, codeql, workflow-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
